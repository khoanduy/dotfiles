set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -g set-titles on
set -g window-status-format "#I#{?#{!=:#{pane_current_command},bash},_,:}#W#{window_flags}"
set -g window-status-current-format "#I#{?#{!=:#{pane_current_command},bash},_,:}#W#{window_flags}"
set -g status-right "#{?client_prefix,^b ,}[#(hp-bar)] %H:%M"
set -g status-left-length 64
set -g status-right-length 64
set -g status-interval 5
set -g mouse on
set -g history-limit 100000
set -g renumber-windows on
set -sg escape-time 10
set -gw mode-keys vi
%hidden yankcmd="command -v pbcopy >/dev/null && pbcopy || wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "$yankcmd"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "$yankcmd"
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind -n M-s split-window -v
bind -n M-v split-window -h
bind -n M-t new-window
bind -n M-z resize-pane -Z
bind -n M-\; command-prompt
bind -n M-p previous-window
bind -n M-n next-window
bind -n M-w choose-tree -Zs
bind -n M-a switch-client -l
bind -n M-[ copy-mode
bind -n M-o command-prompt -p "wormhole>" {
    set @wormhole_pattern "%1"
    run-shell -b "bash -c 'wormhole #{q:@wormhole_pattern}'"
} # passes prompt input shell-quoted into the script
bind -n -r M-Left resize-pane -L 5
bind -n -r M-Right resize-pane -R 5
bind -n -r M-Up resize-pane -U 5
bind -n -r M-Down resize-pane -D 5
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D
